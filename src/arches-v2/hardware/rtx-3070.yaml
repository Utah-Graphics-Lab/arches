# RTX 3070 ish
# Copy over example.yaml to use, see that file for what each parameter means.
core-clock-mhz: 1500
dram-clock-mhz: 3500
num-tms: 46
num-tps: 128
num-threads: 12
stack-size: 512
rtc-max-rays: 128

# DRAM (dram-config is a file in units/ramulator/config-files)
num-partitions: 8
dram-config: gddr6_14000_config.yaml
dram-latency: 254

# L2$ (policy is LRU, LRU_RANDOM, FIFO or FIFO_RANDOM)
l2-size-kb: 512
l2-associativity: 16
l2-slices: 4
l2-mshr: 192
l2-subentries: 4
l2-latency: 187
l2-miss-alloc: 1
l2-block-prefetch: 0
l2-policy: LRU

# L1d$
l1d-size-kb: 128
l1d-associativity: 32
l1d-banks: 4
l1d-mshr: 384
l1d-subentries: 48
l1d-latency: 39
l1d-miss-alloc: 1
l1d-policy: FIFO
